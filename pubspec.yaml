name: markast_flutter_example
description: "Example app for the markast Flutter package."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  markast:
    path: ../flutter_markast
  url_launcher: ^6.3.1
  # Direct dep so Flutter bundles syntax_highlight's grammar / theme JSON
  # assets — transitive bundling via the path-imported `markast` package is
  # unreliable. Required by the TextMate / VSCode highlight backend.
  syntax_highlight: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/document.json
